<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Test WebSocket Reverb - SCADA Dashboard</title>
        <script src="https://js.pusher.com/8.2.0/pusher.min.js"></script>
        <script src="https://unpkg.com/laravel-echo@1.15.3/dist/echo.iife.js"></script>
        <script src="js/scada-websocket-client.js"></script>
        <style>
            body {
                font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
                margin: 0;
                padding: 20px;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                min-height: 100vh;
            }
            .container {
                max-width: 1200px;
                margin: 0 auto;
                background: white;
                border-radius: 15px;
                box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
                overflow: hidden;
            }
            .header {
                background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
                color: white;
                padding: 30px;
                text-align: center;
            }
            .header h1 {
                margin: 0;
                font-size: 2.5rem;
                font-weight: 300;
            }
            .header p {
                margin: 10px 0 0 0;
                opacity: 0.9;
                font-size: 1.1rem;
            }
            .content {
                padding: 30px;
            }
            .status-grid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
                gap: 20px;
                margin-bottom: 30px;
            }
            .status-card {
                background: #f8fafc;
                border: 2px solid #e2e8f0;
                border-radius: 12px;
                padding: 20px;
                text-align: center;
                transition: all 0.3s ease;
            }
            .status-card:hover {
                transform: translateY(-5px);
                box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            }
            .status-card.connected {
                border-color: #10b981;
                background: #f0fdf4;
            }
            .status-card.disconnected {
                border-color: #ef4444;
                background: #fef2f2;
            }
            .status-card.connecting {
                border-color: #f59e0b;
                background: #fffbeb;
            }
            .status-indicator {
                width: 20px;
                height: 20px;
                border-radius: 50%;
                display: inline-block;
                margin-right: 10px;
            }
            .status-indicator.connected {
                background: #10b981;
            }
            .status-indicator.disconnected {
                background: #ef4444;
            }
            .status-indicator.connecting {
                background: #f59e0b;
            }
            .status-text {
                font-size: 1.2rem;
                font-weight: 600;
                margin: 10px 0;
            }
            .metric-value {
                font-size: 2rem;
                font-weight: 700;
                color: #1e293b;
            }
            .controls {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
                gap: 15px;
                margin-bottom: 30px;
            }
            .btn {
                padding: 12px 24px;
                border: none;
                border-radius: 8px;
                font-size: 1rem;
                font-weight: 600;
                cursor: pointer;
                transition: all 0.3s ease;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
            }
            .btn-primary {
                background: #3b82f6;
                color: white;
            }
            .btn-primary:hover {
                background: #2563eb;
                transform: translateY(-2px);
            }
            .btn-success {
                background: #10b981;
                color: white;
            }
            .btn-success:hover {
                background: #059669;
                transform: translateY(-2px);
            }
            .btn-danger {
                background: #ef4444;
                color: white;
            }
            .btn-danger:hover {
                background: #dc2626;
                transform: translateY(-2px);
            }
            .btn-warning {
                background: #f59e0b;
                color: white;
            }
            .btn-warning:hover {
                background: #d97706;
                transform: translateY(-2px);
            }
            .logs {
                background: #1e293b;
                color: #e2e8f0;
                border-radius: 12px;
                padding: 20px;
                font-family: "Courier New", monospace;
                font-size: 0.9rem;
                max-height: 400px;
                overflow-y: auto;
            }
            .log-entry {
                margin: 5px 0;
                padding: 5px 0;
                border-bottom: 1px solid #334155;
            }
            .log-entry.info {
                color: #60a5fa;
            }
            .log-entry.success {
                color: #34d399;
            }
            .log-entry.warning {
                color: #fbbf24;
            }
            .log-entry.error {
                color: #f87171;
            }
            .log-timestamp {
                color: #64748b;
                margin-right: 10px;
            }
            .channel-info {
                background: #f1f5f9;
                border-radius: 12px;
                padding: 20px;
                margin-top: 20px;
            }
            .channel-list {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
                gap: 15px;
            }
            .channel-item {
                background: white;
                border: 1px solid #e2e8f0;
                border-radius: 8px;
                padding: 15px;
                text-align: center;
            }
            .channel-name {
                font-weight: 600;
                color: #1e293b;
                margin-bottom: 5px;
            }
            .channel-status {
                font-size: 0.9rem;
                color: #64748b;
            }
            .channel-status.subscribed {
                color: #10b981;
            }
            .channel-status.unsubscribed {
                color: #ef4444;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="header">
                <h1>🔌 WebSocket Reverb Test</h1>
                <p>
                    Test koneksi dan fungsionalitas WebSocket dengan Laravel
                    Reverb
                </p>
            </div>

            <div class="content">
                <!-- Status Grid -->
                <div class="status-grid">
                    <div class="status-card" id="connectionCard">
                        <div
                            class="status-indicator"
                            id="connectionIndicator"
                        ></div>
                        <div class="status-text" id="connectionStatus">
                            Disconnected
                        </div>
                        <div class="metric-value" id="connectionUptime">0s</div>
                        <div>Uptime</div>
                    </div>

                    <div class="status-card">
                        <div class="status-indicator connected"></div>
                        <div class="status-text">Channels</div>
                        <div class="metric-value" id="channelCount">0</div>
                        <div>Subscribed</div>
                    </div>

                    <div class="status-card">
                        <div class="status-indicator connected"></div>
                        <div class="status-text">Messages</div>
                        <div class="metric-value" id="messageCount">0</div>
                        <div>Received</div>
                    </div>

                    <div class="status-card">
                        <div class="status-indicator connected"></div>
                        <div class="status-text">Latency</div>
                        <div class="metric-value" id="latency">-</div>
                        <div>ms</div>
                    </div>
                </div>

                <!-- Controls -->
                <div class="controls">
                    <button class="btn btn-primary" id="connectBtn">
                        🔌 Connect
                    </button>
                    <button class="btn btn-danger" id="disconnectBtn" disabled>
                        ❌ Disconnect
                    </button>
                    <button class="btn btn-success" id="subscribeBtn" disabled>
                        📡 Subscribe
                    </button>
                    <button
                        class="btn btn-warning"
                        id="unsubscribeBtn"
                        disabled
                    >
                        📡 Unsubscribe
                    </button>
                    <button class="btn btn-primary" id="sendTestBtn" disabled>
                        📤 Send Test
                    </button>
                    <button class="btn btn-warning" id="clearLogsBtn">
                        🗑️ Clear Logs
                    </button>
                </div>

                <!-- Channel Information -->
                <div class="channel-info">
                    <h3>📡 Channel Status</h3>
                    <div class="channel-list" id="channelList">
                        <!-- Channels will be populated here -->
                    </div>
                </div>

                <!-- Logs -->
                <div class="logs" id="logs">
                    <div class="log-entry info">
                        <span class="log-timestamp">[System]</span>
                        WebSocket Reverb Test initialized. Ready to connect.
                    </div>
                </div>
            </div>
        </div>

        <script>
            // Configuration
            const config = {
                host: "127.0.0.1",
                port: 8080,
                appKey: "scada_dashboard_key_2024",
                appId: "12345",
                cluster: "mt1",
            };

            // Global variables
            let wsClient = null;
            let connectionStartTime = null;
            let messageCountValue = 0;
            let lastPingTime = null;
            let pingInterval = null;

            // DOM elements
            const connectBtn = document.getElementById("connectBtn");
            const disconnectBtn = document.getElementById("disconnectBtn");
            const subscribeBtn = document.getElementById("subscribeBtn");
            const unsubscribeBtn = document.getElementById("unsubscribeBtn");
            const sendTestBtn = document.getElementById("sendTestBtn");
            const clearLogsBtn = document.getElementById("clearLogsBtn");
            const connectionCard = document.getElementById("connectionCard");
            const connectionIndicator = document.getElementById(
                "connectionIndicator"
            );
            const connectionStatus =
                document.getElementById("connectionStatus");
            const connectionUptime =
                document.getElementById("connectionUptime");
            const channelCount = document.getElementById("channelCount");
            const messageCount = document.getElementById("messageCount");
            const latency = document.getElementById("latency");
            const logs = document.getElementById("logs");
            const channelList = document.getElementById("channelList");

            // Initialize WebSocket client
            function initWebSocketClient() {
                try {
                    wsClient = new ScadaWebSocketClient({
                        host: config.host,
                        port: config.port,
                        appKey: config.appKey,
                        cluster: config.cluster,
                        onConnect: handleConnect,
                        onDisconnect: handleDisconnect,
                        onMessage: handleMessage,
                        onError: handleError,
                    });

                    log("WebSocket client initialized", "info");
                    return true;
                } catch (error) {
                    log(
                        `Failed to initialize WebSocket client: ${error.message}`,
                        "error"
                    );
                    return false;
                }
            }

            // Event handlers
            function handleConnect() {
                log("✅ Connected to Reverb WebSocket server", "success");

                connectionStartTime = Date.now();
                connectionCard.className = "status-card connected";
                connectionIndicator.className = "status-indicator connected";
                connectionStatus.textContent = "Connected";

                connectBtn.disabled = true;
                disconnectBtn.disabled = false;
                subscribeBtn.disabled = false;
                sendTestBtn.disabled = false;

                startPingInterval();
                updateChannelList();
            }

            function handleDisconnect() {
                log("❌ Disconnected from WebSocket server", "warning");

                connectionCard.className = "status-card disconnected";
                connectionIndicator.className = "status-indicator disconnected";
                connectionStatus.textContent = "Disconnected";

                connectBtn.disabled = false;
                disconnectBtn.disabled = true;
                subscribeBtn.disabled = true;
                unsubscribeBtn.disabled = true;
                sendTestBtn.disabled = true;

                stopPingInterval();
                updateChannelList();
            }

            function handleMessage(data) {
                messageCountValue++;
                messageCount.textContent = messageCountValue;

                log(`📨 Message received: ${JSON.stringify(data)}`, "info");
            }

            function handleError(error) {
                log(`❌ WebSocket error: ${error.message}`, "error");
            }

            // Button event handlers
            connectBtn.addEventListener("click", () => {
                if (!wsClient) {
                    if (!initWebSocketClient()) {
                        return;
                    }
                }

                log("🔄 Attempting to connect...", "info");
                connectionCard.className = "status-card connecting";
                connectionIndicator.className = "status-indicator connecting";
                connectionStatus.textContent = "Connecting...";
            });

            disconnectBtn.addEventListener("click", () => {
                if (wsClient) {
                    wsClient.disconnect();
                    wsClient = null;
                }
            });

            subscribeBtn.addEventListener("click", () => {
                if (wsClient && wsClient.isConnected()) {
                    const success = wsClient.subscribe(
                        "scada-data",
                        "scada.data.received",
                        (data) => {
                            log(
                                `📡 Subscribed to scada-data channel`,
                                "success"
                            );
                        }
                    );

                    if (success) {
                        updateChannelList();
                    }
                }
            });

            unsubscribeBtn.addEventListener("click", () => {
                if (wsClient && wsClient.isConnected()) {
                    const success = wsClient.unsubscribe("scada-data");

                    if (success) {
                        log(
                            `📡 Unsubscribed from scada-data channel`,
                            "warning"
                        );
                        updateChannelList();
                    }
                }
            });

            sendTestBtn.addEventListener("click", () => {
                if (wsClient && wsClient.isConnected()) {
                    const testData = {
                        temperature: Math.random() * 30 + 20,
                        humidity: Math.random() * 40 + 40,
                        pressure: Math.random() * 100 + 900,
                        timestamp: new Date().toISOString(),
                    };

                    const success = wsClient.sendMessage(
                        "scada-data",
                        "test.data",
                        testData
                    );

                    if (success) {
                        log(
                            `📤 Test message sent: ${JSON.stringify(testData)}`,
                            "success"
                        );
                    } else {
                        log(`❌ Failed to send test message`, "error");
                    }
                }
            });

            clearLogsBtn.addEventListener("click", () => {
                logs.innerHTML =
                    '<div class="log-entry info"><span class="log-timestamp">[System]</span> Logs cleared.</div>';
            });

            // Utility functions
            function log(message, type = "info") {
                const timestamp = new Date().toLocaleTimeString();
                const logEntry = document.createElement("div");
                logEntry.className = `log-entry ${type}`;
                logEntry.innerHTML = `<span class="log-timestamp">[${timestamp}]</span> ${message}`;

                logs.appendChild(logEntry);
                logs.scrollTop = logs.scrollHeight;
            }

            function startPingInterval() {
                if (pingInterval) {
                    clearInterval(pingInterval);
                }

                pingInterval = setInterval(() => {
                    if (connectionStartTime) {
                        const uptime = Math.floor(
                            (Date.now() - connectionStartTime) / 1000
                        );
                        connectionUptime.textContent = `${uptime}s`;
                    }

                    if (wsClient && wsClient.isConnected()) {
                        lastPingTime = Date.now();
                        // Simulate ping
                        setTimeout(() => {
                            if (lastPingTime) {
                                const pingLatency = Date.now() - lastPingTime;
                                latency.textContent = pingLatency;
                            }
                        }, 100);
                    }
                }, 1000);
            }

            function stopPingInterval() {
                if (pingInterval) {
                    clearInterval(pingInterval);
                    pingInterval = null;
                }

                connectionStartTime = null;
                connectionUptime.textContent = "0s";
                latency.textContent = "-";
            }

            function updateChannelList() {
                if (!wsClient) {
                    channelList.innerHTML =
                        '<div class="channel-item"><div class="channel-name">No Connection</div><div class="channel-status">Disconnected</div></div>';
                    channelCount.textContent = "0";
                    return;
                }

                const channels = wsClient.getSubscribedChannels();
                channelCount.textContent = channels.length;

                if (channels.length === 0) {
                    channelList.innerHTML =
                        '<div class="channel-item"><div class="channel-name">No Channels</div><div class="channel-status">Not Subscribed</div></div>';
                } else {
                    channelList.innerHTML = channels
                        .map(
                            (channel) => `
                    <div class="channel-item">
                        <div class="channel-name">${channel.name}</div>
                        <div class="channel-status subscribed">Subscribed</div>
                        <div class="channel-status">${
                            channel.eventName || "All Events"
                        }</div>
                    </div>
                `
                        )
                        .join("");
                }
            }

            // Initialize on page load
            document.addEventListener("DOMContentLoaded", () => {
                log("🚀 Page loaded, initializing WebSocket test...", "info");

                // Check if required libraries are loaded
                if (typeof Pusher === "undefined") {
                    log("❌ Pusher.js library not loaded", "error");
                    return;
                }

                if (typeof Echo === "undefined") {
                    log("❌ Laravel Echo library not loaded", "error");
                    return;
                }

                log("✅ All required libraries loaded successfully", "success");

                // Initialize WebSocket client
                initWebSocketClient();
            });

            // Cleanup on page unload
            window.addEventListener("beforeunload", () => {
                if (wsClient) {
                    wsClient.destroy();
                }

                if (pingInterval) {
                    clearInterval(pingInterval);
                }
            });
        </script>
    </body>
</html>
